# ============================================================
# FlintHub — Nginx 站点配置（宝塔面板专用）
# ============================================================
# ★ 用法（宝塔）：
#   打开「网站 → 对应站点 → 设置 → 配置文件」，把下面从 server{ } 起的完整片段
#   覆盖进去（保留宝塔自动生成、与 PHP-FPM 相关的 fastcgi 配置块即可，二选一）。
#
# ★ 与项目自带 nginx-server.conf 的区别：
#   那份是 phpstudy 专用（fastcgi_pass=127.0.0.1:9001，phpstudy 面板固定映射）。
#   宝塔用 Unix socket 与 php-fpm 通信，路径随 PHP 版本变化，本文件已改成宝塔写法。
#
# ★ 必改项（否则无法访问）：
#   ① root /www/wwwroot/<你的站点目录>;   ← 改成你的真实站点路径
#   ② fastcgi_pass 的 socket 路径        ← 改成宝塔当前 PHP 版本的路径
#      常见：82 → /www/server/php/82/sbin/php-fpm
#            74 → /www/server/php/74/sbin/php-fpm
#   ③ 若站点根目录不是程序根目录（如程序装在 /flinthub 二级目录）：
#      - base 路径需与程序 config.php 的 BASE_PATH 一致
#      - 下列 location 的路径都要加前缀，如 ^/flinthub/(data|protected|cli)/
#
# ★ 接入后验证：
#   宝塔 → 网站 → 站点 → 设置 → 配置文件，点「保存」；再在浏览器访问：
#       http://你的域名/install.php
#   若卸载/更新后 install.php 仍在，可直接进入安装向导。
# ============================================================

server {
    listen        80;
    server_name  _;

    # ★ 站点根目录（必改）
    root   "/www/wwwroot/你的站点目录";

    index  index.php index.html;
    charset utf-8;

    # ============================================================
    # 一、敏感目录禁止直接访问（数据/会话/日志/CLI 脚本）
    # ============================================================
    # data/   → SQLite 分片库（用户密码哈希/会话/帖子数据）
    # protected/ → 日志、config.php 备份（含 MAIL_PASS_KEY）、安装标记
    # cli/    → 迁移/归档/队列等管理脚本（Web 直访可触发真实写操作）
    # （PHP 通过文件系统访问不受影响，此规则只拦 HTTP 直访）
    location ~ ^/(data|protected|cli)/ {
        deny all;
        return 403;
    }

    # ============================================================
    # 二、全部插件数据目录禁止直接下载（含 code_repo 仓库源码）
    # ============================================================
    location ~ ^/plugins/[^/]+/data/ {
        deny all;
        return 403;
    }

    # ============================================================
    # 三、上传目录禁止 PHP 执行（纵深防御：扩展名白名单之外的第二道防线）
    # ============================================================
    location ~ ^/assets/uploads/.*\.php$ {
        deny all;
        return 403;
    }

    # ============================================================
    # 四、/repo/ 仓库浏览路由（优先于 .php 正则匹配）
    # ============================================================
    # 仓库文件可能以 .php 结尾（index.php/init.php），其浏览链接含 .php 段，
    # 会被下方 location ~ \.php 正则捕获 → fastcgi 拿不存在脚本 → 403。
    # 用 ^~ 前缀块（优先级高于正则 location）+ try_files 内部转发到前端控制器，
    # 由 Router 路由到 RepoController；.php 仅作 URL 段名，绝不作为脚本执行。
    # ⚠ 勿用 rewrite last 转发到 /index.php/{原路径}：php-cgi 的 cgi.fix_pathinfo
    #   path_info 含 .php 段会二次解析 → "No input file specified" → 403。
    location ^~ /repo/ {
        try_files $uri /index.php;
    }

    # ============================================================
    # 五、PWA manifest MIME（老版本 Nginx 无此类型）
    # ============================================================
    location = /assets/pwa/manifest.webmanifest {
        default_type application/manifest+json;
    }

    # ============================================================
    # 六、博客 SVG 封面 MIME
    # ============================================================
    location ^~ /assets/uploads/covers/ {
        default_type image/svg+xml;
    }

    # ============================================================
    # 七、伪静态：非真实文件/目录请求统一走前端控制器
    # ============================================================
    location / {
        if (!-e $request_filename) {
            rewrite ^/(.*)$ /index.php/$1 last;
        }
        autoindex off;
    }

    # ============================================================
    # 八、PHP 解析（宝塔自动生成部分通常已包含，保留一份供手动接入参考）
    # ============================================================
    # location ~ \.php(.*)$ {
    #     fastcgi_pass   unix:/www/server/php/82/sbin/php-fpm;   # ★ 按 PHP 版本改
    #     fastcgi_index  index.php;
    #     fastcgi_split_path_info  ^((?U).+\.php)(/?.+)$;
    #     fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    #     fastcgi_param  PATH_INFO  $fastcgi_path_info;
    #     fastcgi_param  PATH_TRANSLATED  $document_root$fastcgi_path_info;
    #     include        fastcgi_params;
    # }
}