# ============================================================
# SoSite — Nginx 站点完整配置（随程序走，不依赖 phpstudy 面板）
# ============================================================
# ★ 接入方式（一次性）：
#   在 nginx.conf 的 http 块中，`include vhosts/*.conf;` 之前加一行：
#       include D:/phpstudy_pro/WWW/nginx-server.conf;
#   然后执行：cd D:/phpstudy_pro/Extensions/Nginx1.15.11 && nginx -t && nginx -s reload
#
# ★ 为什么这样设计：
#   phpstudy 面板切换 PHP 版本 / 修改站点时，会整文件重写 conf/vhosts/*.conf，
#   手写的 rewrite 规则会被覆盖（伪静态 404 的根因）。
#   本文件位于程序根目录，nginx 直接读取它 → 面板怎么重写 vhost 都不影响规则。
#
# ★ 切换 PHP 版本时：
#   fastcgi_pass 端口对应面板当前启用的 PHP 版本（xp.ini 固定映射）：
#       9000 → php7.3.4nts  |  9001 → php8.0.2nts  |  9002 → php8.2.9nts
#   切换版本后如 PHP 502，把下方 fastcgi_pass 端口改为对应值即可（本文件内）。
#
# ★ 部署到其他环境：修改 root 指向你的程序目录即可。
# ============================================================

# ★ PHP 后端：直接指向当前 PHP 版本端口（phpstudy 固定映射：9000→php7.3 | 9001→php8.0.2 | 9002→php8.2.9）
#   之前用 upstream 三端口轮询（想免配置切版本），但死端口会拖慢每个请求（实测 2.4s），
#   改回单端口直连：无轮询开销、无延迟。切换 PHP 版本后如 502，改下方端口即可。
#   （如需彻底免配置切版本，正确方向是程序生成查询参数 URL——见"重写规则备忘.md"）

server {
    listen        80;
    server_name  localhost;
    root   "D:/phpstudy_pro/WWW";

    # ★ [审计修复 2026-08-16] 禁止直接访问数据/敏感目录（Nginx 侧兜底）：
    #   data/ 下为 SQLite 分片库（用户密码哈希/会话/帖子数据），protected/ 含日志、config.php 备份（MAIL_PASS_KEY）、
    #   legacy 归档等——此前无防护可被直接下载（实测 206）。PHP 通过文件系统访问不受影响。
    #   code_repo 插件仓库数据目录（P35 追加）：plugins/code_repo/data/ 内含用户仓库源码，同样禁止直接访问。
    #   部署到其他环境时：把 root 换成你的程序目录即可，本规则随程序走。
    #
    # ★ [审计修复 2026-08-18] 追加防护（全盘审计_20260818 高危#1/#2、中危#5）：
    #   - cli/ 目录：脚本含迁移/归档/队列消费等管理操作，多数无 SAPI 守卫，Web 直访可触发真实写操作（高危#1）；
    #   - plugins/*/data/：全部插件的 SQLite 独立库（邀请码/勋章/通知/收藏/红包等）禁止直接下载（高危#2）；
    #   - assets/uploads/ 禁 PHP 执行：纵深防御，即使上传绕过白名单也不可解析（中危#5）。
    location ~ ^/(data|protected|cli)/ {
        deny all;
        return 403;
    }

    # 全部插件数据目录（含 code_repo/data 仓库源码；规则泛化，覆盖全部 16 插件）
    location ~ ^/plugins/[^/]+/data/ {
        deny all;
        return 403;
    }

    # 上传目录禁止 PHP 执行（纵深防御：扩展名白名单之外的第二道防线）
    location ~ ^/assets/uploads/.*\.php$ {
        deny all;
        return 403;
    }

    # ★ [P40 修复 2026-08-16] /repo/ 仓库浏览路由优先于 .php 脚本规则：
    #   code_repo 插件仓库内文件可能以 .php 结尾（如 index.php/init.php），其浏览链接
    #   /repo/{仓库}/{路径...}/file 与自动识别链接均含 .php 段 → 会被下方 location ~ \.php
    #   正则捕获 → fastcgi 拿不存在脚本 → 403（仓库文件永远到不了前端控制器路由）。
    #   用 ^~ 前缀块（优先级高于所有正则 location）+ try_files 内部转发到 /index.php 前端控制器，
    #   由 Router 路由到 RepoController；`.php` 仅作 URL 段名，绝不作为脚本执行。
    location ^~ /repo/ {
        # ★ [P40 修复] /repo/ 仓库浏览路由优先于 .php 脚本规则。
        #   用 try_files 内部转发到 /index.php（前端控制器），由 Router 路由到 RepoController。
        #   ⚠ 不能用 rewrite ... last 转发到 /index.php/{原路径}：若仓库文件名为 .php（如 index.php），
        #   转发后的 URI /index.php/repo/.../index.php 会再次匹配 location ~ \.php 且 path_info 含 .php 段，
        #   phpstudy php-cgi（cgi.fix_pathinfo 默认开启）二次解析 → "No input file specified" → 403。
        #   try_files 保持 REQUEST_URI 为 /repo/...，path_info 不含 .php，问题消失。
        try_files $uri /index.php;
    }

    # ★ [PWA 2026-08-21] .webmanifest MIME 映射：老版本 Nginx 的 mime.types 无此类型，
    #   缺省会返回 application/octet-stream → Chrome 拒绝识别 manifest → 安装入口不出现。
    #   用精确 location + default_type 只对该文件生效（server 级 types 块会覆盖全局 mime.types，
    #   导致 CSS/PNG 全部变 octet-stream——2026-08-21 已踩坑，勿改回）。
    location = /assets/pwa/manifest.webmanifest {
        default_type application/manifest+json;
    }

    # ★ [博客封面 2026-08-22] .svg MIME 映射：老版本 Nginx 的 mime.types 可能无 image/svg+xml，
    #   缺省会返回 application/octet-stream → 浏览器 <img>/CSS background 无法渲染 SVG 封面。
    #   仿 .webmanifest 先例：前缀 location + default_type 只对 covers 目录生效。
    location ^~ /assets/uploads/covers/ {
        default_type image/svg+xml;
    }

    location / {
        index index.php index.html;
        # SoSite 伪静态：非真实文件/目录请求统一转发到 index.php（前端控制器路由）
        # 规则与站点配置同文件、随程序走，面板重写 vhost 不影响
        if (!-e $request_filename) {
            rewrite ^/(.*)$ /index.php/$1 last;
        }
        error_page 400 /error/400.html;
        error_page 403 /error/403.html;
        error_page 404 /error/404.html;
        error_page 500 /error/500.html;
        error_page 501 /error/501.html;
        error_page 502 /error/502.html;
        error_page 503 /error/503.html;
        error_page 504 /error/504.html;
        error_page 505 /error/505.html;
        error_page 506 /error/506.html;
        error_page 507 /error/507.html;
        error_page 509 /error/509.html;
        error_page 510 /error/510.html;
        autoindex  off;
    }

    location ~ \.php(.*)$ {
        fastcgi_pass   127.0.0.1:9001;
        fastcgi_index  index.php;
        fastcgi_split_path_info  ^((?U).+\.php)(/?.+)$;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO  $fastcgi_path_info;
        fastcgi_param  PATH_TRANSLATED  $document_root$fastcgi_path_info;
        include        fastcgi_params;
    }
}
